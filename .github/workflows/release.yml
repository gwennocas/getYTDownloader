name: Release Windows
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $env:PATH += ";$env:USERPROFILE\go\bin"
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $env:RELEASE_TAG.TrimStart('v')
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json
          wails build -clean -platform windows/amd64 -o getYTDownloader.exe -ldflags "-X main.version=$env:RELEASE_TAG"
      - name: Package release
        shell: pwsh
        run: Compress-Archive -LiteralPath build/bin/getYTDownloader.exe -DestinationPath getYTDownloader_windows_amd64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" getYTDownloader_windows_amd64.zip --generate-notes --title "getYTDownloader ${{ github.ref_name }}"
